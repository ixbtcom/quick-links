name: "Fix PHP Code Styling"

on:
  push:
    paths:
      - '**.php'

permissions:
  contents: read

jobs:
  php-code-styling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Check PHP code style
        uses: aglipanci/laravel-pint-action@2.6
        with:
          testMode: true
          pintVersion: '1.32.1'
